name: ci

on:
  push:
  pull_request:

jobs:
  conmon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml jsonschema pytest
      - name: Rebuild POA&M and reports; fail if stale or invalid
        run: python tools/conmon.py --check
      - run: pytest -q tests
